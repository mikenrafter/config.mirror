Config
 {
 --{- dock info
   position = Static { xpos = 0, ypos = 0, width = 1920, height = 24 } -- Top { height = 50 }
 , overrideRedirect = False
 , lowerOnStart = True, persistent = True
 , hideOnStart = False, allDesktops = True
 --}
 --{- fonts
 , font = "xft:Mononoki Nerd Font:pixelsize=12:antialias=true:hinting=true"
 , additionalFonts = ["xft:FontAwesome:pixelsize=13"]
 --}
 --{- main colors
 , bgColor = "#222", fgColor = "#5c9" --"#8fb"
 --}
 --{- commands
 , commands = [
  --{- colors
    Run Com "echo" ["#222"] "bg1" 0  -- color customization:
  , Run Com "echo" ["#334"] "bg2" 0
  , Run Com "echo" ["#556"] "bg3" 0

  , Run Com "echo" ["#59c"] "fg1" 0  -- blue   old: "#8bf"
  , Run Com "echo" ["#c95"] "fg2" 0  -- orange    : "#fb8"
  , Run Com "echo" ["#c55"] "fg3" 0  -- red       : "#f88"
  , Run Com "echo" ["#5c9"] "fg4" 0  -- green     : "#8fb"
  , Run Com "echo" ["#95c"] "fg5" 0  -- purple    : "#b8f"
  --}
  --{- applications
  , Run Com "echo" ["thunar"]              "files"   0  -- application customization:
  , Run Com "echo" ["pavucontrol"]          "mixer"   0
  , Run Com "echo" ["alacritty -e btm"]     "monitor" 0
  , Run Com "echo" ["pamac-manager"]        "pkgs"    0
  , Run Com "echo" ["alacritty -e nmtui"]   "netm"    0
  --}
  --{- bits
  , Run Com "echo" ["<box width=3 type=Bottom color="] "bo"  0
  , Run Com "echo" ["</box>"]              "bc"  0
  --}
  --{- icons
  , Run Com "echo" ["\xf11c "] "ikbd"  0  -- icons : iname[:4]:
  , Run Com "echo" ["\xf1eb "] "inet"  0
  , Run Com "echo" ["\xf2db"]  "icpu"  0
  , Run Com "echo" ["\xf0ae "] "imem"  0
  , Run Com "echo" ["\xf07c"]  "idisk" 0
  , Run Com "echo" ["\xf1b2"]  "iupd"  0
  , Run Com "echo" ["\xf0eb"]  "ibri"  0
  , Run Com "echo" ["\xf017"]  "itime" 0

--, Run Com "echo" ["K"] "ikbd"  0  -- this version is for when icons choose to fail for some reason
--, Run Com "echo" ["N"] "inet"  0
--, Run Com "echo" ["C"] "icpu"  0
--, Run Com "echo" ["M"] "imem"  0
--, Run Com "echo" ["D"] "idisk" 0
--, Run Com "echo" ["U"] "iupd"  0
--, Run Com "echo" ["B"] "ibri"  0
--, Run Com "echo" ["T"] "itime" 0
  --}
  --{- date
  , Run Date "%d %a" "date" 36000  -- 1h
  , Run Date "%l:%M %p" "time" 600  -- 1m
  --}
  --{- trayer width
  , Run Com "/home/v0id/.xmonad/tray.sh" [] "tray" 10  -- 1s
  --}
  --{- keyboard status'
  , Run Locks
  , Run Kbd [("us(colemak)", "<box type=Bottom width=1 color=limegreen>colemak</box>"), ("us", "qwerty")]
  --}
  --{- network speed
  , Run DynNetwork ["-t", "<rx>kb <tx>kb"] 20  -- 2s
  --}
  --{- CPU, temp
  , Run Cpu [ "-t", "<total>%"] 20  -- 2s
--  , Run TopProc ["-t", "<name1>"] 20  -- 2s
  , Run MultiCoreTemp ["-t", "<avg>C"] 50 -- 5s
  --}
  --{- mem, swap %
  , Run Memory ["-t", "<usedratio>%"] 20  -- 2s
  , Run Swap ["-t", "<usedratio>%"] 20  -- 2s
  --}
  --{- disk free
  , Run DiskU [("/home", "<free>")] [] 18000  -- 30m
  --}
  --{- uptime
  , Run Com "/home/v0id/.xmonad/uptime.sh" [] "uptime" 12000  -- 20m
  --}
  --{- check for updates
  , Run Com "/home/v0id/.xmonad/updates.sh" [] "updates" 18000  -- 30m
  --}
  --{- brightness
  , Run Brightness [ "-t", "<percent>%" -- <bar>
   , "-b", " "
   , "-f", ":"
   , "-m", "2"
   , "-W", "4"

   , "--"
   , "-D", "intel_backlight"
  ] 10 -- 1s
  --}
  --{- volume
  , Run Alsa "default" "Master"
   [ "-t", "<status><volume>"
-- [ "-t", "V <volumebar> <status>" --<volume>"
   , "-b", " "
   , "-f", ":"
   , "-W", "4"
   , "-m", "2"

   , "--"
   , "--offc", "#000,#c55", "--off", "\xf026 "
-- , "--offc", "#000,#c55", "--off", "--" -- "\xf026 "
-- , "--onc",  "#000,#c55", "--on",  "<volume>" -- "\xf027 "
   , "--onc",  "#000,#c55", "--on",  "\xf027 "
   ] -- 10  -- 1s
   --}
  --{- battery
  , Run Battery
   [ "-t", "<acstatus>" -- <leftbar>
   , "-b", " "
   , "-f", ":"
   , "-m", "2"
   , "-W", "4"

   , "--"

   , "--off",  "\xf242  <left>"
   , "--idle", "\xf240  <left>"
   , "--on",   "\xf1e6  <left>"
-- , "--off", "-<left>" -- "\xf242"
-- , "--idle", " <left>" -- "\xf240"
-- , "--on", "+<left>" -- "\xf1e6"
   ,"-A", "15"
   , "-a", "notify-send -i battery-low 'Low battery!'"
   ] 40  -- 4s
   --}
  --{- xmonad pipe
  , Run UnsafeStdinReader
  --}
  ] --}
  --{- template
  , template = " %tray% %UnsafeStdinReader%}{<fc=%fg2%,%bg2%> %ikbd% %kbd% [%locks%] </fc> - <fc=%fg1%,%bg1%><action=%netm%> %bo%%fg1%>%inet% %dynnetwork%%bc%</action> <action=%monitor%>%bo%%fg1%> %icpu% %cpu% %multicoretemp% %bc% %bo%%fg1%>%imem% %memory% %swap%%bc% </action></fc> <fc=%fg2%,%bg1%><action=%files%>%bo%%fg2%>%itime% %uptime%%bc%</action> <action=%pkgs%>%bo%%fg2%>%iupd% %updates%%bc%</action> </fc> <fc=%bg1%,%fg3%> %ibri% %bright% <action=%mixer%>%bo%%fg3%> %alsa:default:Master% %bc%</action> %battery% </fc> - <fc=%fg4%,%bg2%> %itime% %date% %time% </fc> "
  --}
 }
